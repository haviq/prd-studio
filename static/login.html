<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in - PRD Studio</title>
<meta name="description" content="Sign in to PRD Studio with GitHub to save and revise your PRDs." />
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css?v=1791566010" />
<meta property="og:type" content="website" />
<meta property="og:title" content="PRD Studio" />
<meta property="og:description" content="AI product spec generator. One sentence in, a complete PRD out." />
<meta property="og:image" content="/og.png" />
<meta property="og:url" content="https://prd.haaviq.dev/" />
<meta name="twitter:card" content="summary_large_image" />
</head>
<body>
<nav>
  <div class="inner">
    <a class="logo" href="/"><span class="mark">P</span>PRD Studio</a>
    <a class="btn ghost sm" href="/">&larr; Home</a>
  </div>
</nav>

<section>
  <div class="wrap" style="max-width:460px">
    <div class="panel" style="text-align:center;padding:40px 32px">
      <div class="mark-big">P</div>
      <h2 style="margin:18px 0 8px">Sign in to PRD Studio</h2>
      <p style="color:#4a4945;font-size:.96rem;margin-bottom:26px">Save your PRDs, revise them any time and unlock more generations per day.</p>
      <a class="btn primary" href="/auth/github" style="width:100%">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" style="margin-right:2px"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        Continue with GitHub
      </a>

      <div style="display:flex;align-items:center;gap:12px;margin:20px 0;color:#b0aea5;font-size:.8rem">
        <span style="flex:1;height:1px;background:var(--lightgray)"></span>or<span style="flex:1;height:1px;background:var(--lightgray)"></span>
      </div>

      <div style="text-align:left">
        <input id="email" type="email" placeholder="Email" autocomplete="email" />
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
        <button class="btn accent" id="emailBtn" type="button" style="width:100%">Sign in with email</button>
        <div class="status" id="loginStatus"></div>
      </div>
      <p class="hint" style="margin-top:18px">Free account: 10 PRDs/day &middot; save &amp; revise unlimited. No card required.</p>
      <div style="margin-top:22px;border-top:1px solid var(--lightgray);padding-top:18px">
        <a href="/studio" style="color:#8a8880;font-size:.88rem;text-decoration:none">Continue as guest &rarr;</a>
      </div>
    </div>
    <p style="text-align:center;color:#8a8880;font-size:.82rem;margin-top:18px">By continuing you agree to our <a href="/terms" style="color:var(--orange)">terms</a>.</p>
  </div>
</section>
<script>
(function(){
  var b = document.getElementById('emailBtn');
  if(!b) return;
  function go(){
    var email = document.getElementById('email').value.trim();
    var pw = document.getElementById('password').value;
    var st = document.getElementById('loginStatus');
    if(!email || !pw){ st.className='status err'; st.textContent='Enter email and password.'; return; }
    b.disabled = true; st.className='status'; st.textContent='Signing in...';
    fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pw})})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
      .then(function(res){
        b.disabled = false;
        if(res.ok){ location.href = '/studio'; }
        else { st.className='status err'; st.textContent = (res.j && res.j.detail) || 'Sign in failed.'; }
      })
      .catch(function(){ b.disabled=false; st.className='status err'; st.textContent='Failed.'; });
  }
  b.addEventListener('click', go);
  document.getElementById('password').addEventListener('keydown', function(e){ if(e.key==='Enter') go(); });
})();
</script>
<script src="/nav-auth.js?v=1791563551"></script>
</body>
</html>
